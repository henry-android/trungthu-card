<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiệp Trung Thu Yêu Thương</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
:root {
    --primary-red: #7C0A02; 
    --dark-red: #4A0404;    
    --royal-gold: #FFD700;  
    --soft-gold: #F4C430;
    --moonlight: #FFF9E6;   
    --bg-desktop: #040814;  
    --font-heading: 'Dancing Script', cursive;
    --font-serif: 'Playfair Display', serif;
    --font-sans: 'Quicksand', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background-color: var(--bg-desktop);
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; overflow: hidden; 
    font-family: var(--font-serif); color: var(--moonlight); position: relative;
}

/* =========================================
   1. DYNAMIC BACKGROUND (Nền chuyển động)
   ========================================= */
.desktop-bg { 
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; 
    background: linear-gradient(-45deg, #050510, #1a0510, #300000, #050510);
    background-size: 400% 400%;
    animation: gradientBG 20s ease infinite;
    overflow: hidden;
}
@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.moon-aura {
    position: absolute; top: 15%; right: 20%;
    width: 150px; height: 150px; border-radius: 50%;
    box-shadow: 0 0 100px 50px rgba(255, 215, 0, 0.15);
    animation: pulseAura 4s infinite alternate;
}
.moon {
    width: 100%; height: 100%;
    background: radial-gradient(circle at 30% 30%, #FFF9E6, #FFD700);
    border-radius: 50%;
    box-shadow: 0 0 50px rgba(255, 215, 0, 0.6), inset -15px -15px 30px rgba(0,0,0,0.2);
}
@keyframes pulseAura {
    from { box-shadow: 0 0 80px 40px rgba(255, 215, 0, 0.15); }
    to { box-shadow: 0 0 130px 60px rgba(255, 215, 0, 0.35); }
}

/* Các ngôi sao */
.star {
    position: absolute; background: #fff; border-radius: 50%;
    box-shadow: 0 0 5px #fff; animation: twinkle infinite alternate;
}
@keyframes twinkle { 
    0% { opacity: 0.2; transform: scale(0.8); } 
    100% { opacity: 1; transform: scale(1.2); } 
}

/* Lồng đèn bay ở background */
.bg-lantern {
    position: absolute; bottom: -100px; width: 35px; height: 50px;
    background: linear-gradient(135deg, #FF4500, #D10000);
    border-radius: 15px; box-shadow: 0 0 20px rgba(255, 69, 0, 0.8);
    animation: floatBgLantern linear forwards; z-index: 1;
}
.bg-lantern::after {
    content: ''; position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%);
    width: 8px; height: 15px; background: var(--royal-gold);
    clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%);
}
@keyframes floatBgLantern {
    0% { transform: translateY(0) rotate(-5deg); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% { transform: translateY(-120vh) rotate(5deg); opacity: 0; }
}

/* Hạt đom đóm */
.firefly {
    position: absolute; width: 4px; height: 4px; background: #aaff00;
    border-radius: 50%; box-shadow: 0 0 10px 2px #aaff00;
    animation: flyFirefly linear forwards;
}
@keyframes flyFirefly {
    0% { transform: translate(0, 0) scale(1); opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { transform: translate(calc(100vw * var(--dir-x)), calc(-100vh * var(--dir-y))) scale(0.5); opacity: 0; }
}

/* =========================================
   2. SMARTPHONE FRAME
   ========================================= */
.phone-frame {
    position: relative; width: 375px; height: 812px;
    background-color: var(--primary-red);
    border-radius: 45px; border: 12px solid #1c1c1c;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 0 0 2px #333, inset 0 0 20px rgba(255, 255, 255, 0.1);
    z-index: 10; overflow: hidden; display: flex; flex-direction: column; transition: all 0.3s ease;
}
.phone-frame::before {
    content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 150px; height: 25px; background-color: #1c1c1c;
    border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; z-index: 30;
}

/* =========================================
   3. STATUS BAR
   ========================================= */
.status-bar {
    height: 40px; background: transparent; display: flex; justify-content: space-between; align-items: center;
    padding: 0 25px; font-family: sans-serif; font-size: 14px; font-weight: 600; color: var(--moonlight);
    z-index: 20; position: absolute; top: 0; left: 0; width: 100%;
}
.status-bar .icons { display: flex; gap: 6px; align-items: center; }

/* =========================================
   4. INTRO SCREEN (Phóng to mờ dần)
   ========================================= */
.intro-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, #7C0A02 0%, #200000 100%);
    z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center;
    transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 1s ease;
}
.intro-screen.hidden {
    transform: scale(2.5); opacity: 0; pointer-events: none;
}
.intro-lantern { position: relative; width: 80px; margin-bottom: 30px; animation: floatLantern 3s ease-in-out infinite alternate; }
.intro-lantern .lantern-body { height: 100px; background: linear-gradient(135deg, #FF4500, #D10000); border-radius: 30px; box-shadow: 0 0 40px rgba(255, 69, 0, 0.8); border: 3px solid var(--royal-gold); }
.intro-lantern::before { content: ''; position: absolute; top: -50px; left: 50%; transform: translateX(-50%); width: 2px; height: 50px; background: var(--royal-gold); }
.intro-lantern .tassel { position: absolute; bottom: -40px; left: 50%; transform: translateX(-50%); width: 15px; height: 40px; background: linear-gradient(to bottom, var(--royal-gold), #B8860B); clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%); }
@keyframes floatLantern { 0% { transform: translateY(0); } 100% { transform: translateY(-20px); } }

.intro-text {
    font-family: var(--font-sans); color: var(--moonlight); font-size: 1.1rem; margin-bottom: 2rem; font-style: italic; opacity: 0.9;
}

.open-btn {
    padding: 15px 40px; font-family: var(--font-sans); font-size: 1.2rem; font-weight: 600; color: #4A0404;
    background: linear-gradient(135deg, #FFD700, #F4C430); border: none; border-radius: 30px; cursor: pointer;
    box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4); transition: all 0.3s ease; animation: pulseBtn 2s infinite; z-index: 101;
}
.open-btn:hover { transform: scale(1.05); box-shadow: 0 8px 25px rgba(255, 215, 0, 0.6); }
@keyframes pulseBtn { 0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255, 215, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); } }

/* =========================================
   5. APP CONTENT (Nội dung thiệp)
   ========================================= */
.app-content {
    flex: 1; background: radial-gradient(circle at top center, rgba(124, 10, 2, 0.8) 0%, rgba(74, 4, 4, 0.95) 100%);
    position: relative; overflow-y: auto; overflow-x: hidden;
}
.app-content::-webkit-scrollbar { width: 4px; }
.app-content::-webkit-scrollbar-thumb { background: var(--royal-gold); border-radius: 4px; }
#cardFireflies { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden; }

.card { padding: 3rem 1.5rem; min-height: 100%; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2; }

/* Lồng Đèn Trang Trí */
.lantern-container { position: absolute; top: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 15px; }
.lantern { position: relative; width: 45px; animation: swing 3.5s ease-in-out infinite alternate; transform-origin: top center; }
.lantern.right { animation-delay: 1s; }
.lantern-body { height: 60px; background: linear-gradient(135deg, #FF4500, #D10000); border-radius: 20px; box-shadow: 0 0 25px rgba(255, 69, 0, 0.6); border: 2px solid var(--royal-gold); position: relative; }
.lantern::before { content: ''; position: absolute; top: -40px; left: 50%; transform: translateX(-50%); width: 2px; height: 40px; background: var(--royal-gold); }
.lantern .tassel { position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); width: 12px; height: 25px; background: linear-gradient(to bottom, var(--royal-gold), #B8860B); clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%); }
@keyframes swing { 0% { transform: rotate(8deg); } 100% { transform: rotate(-8deg); } }

.card-header { text-align: center; margin-top: 3.5rem; margin-bottom: 2rem; position: relative; z-index: 2; }
.title { font-family: var(--font-heading); color: var(--royal-gold); font-size: 3.8rem; line-height: 1.1; text-shadow: 2px 2px 4px rgba(0,0,0,0.5), 0 0 15px rgba(255, 215, 0, 0.4); animation: textGlow 2s ease-in-out infinite alternate; }
.subtitle { font-family: var(--font-sans); color: var(--moonlight); font-size: 1.1rem; font-weight: 500; margin-top: 10px; text-transform: uppercase; }
.divider { margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 15px; }
.divider::before, .divider::after { content: ''; height: 1px; width: 60px; background: linear-gradient(to right, transparent, var(--royal-gold), transparent); }
.divider span { color: var(--royal-gold); font-size: 1.2rem; }
@keyframes textGlow { from { text-shadow: 2px 2px 4px rgba(0,0,0,0.5), 0 0 10px rgba(255, 215, 0, 0.3); } to { text-shadow: 2px 2px 4px rgba(0,0,0,0.5), 0 0 25px rgba(255, 215, 0, 0.7); } }

/* Hộp Lời Chúc */
.message-box {
    background: rgba(20, 0, 0, 0.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 215, 0, 0.4); padding: 2.5rem 1.5rem; width: 100%; max-width: 320px;
    position: relative; z-index: 2; text-align: center; transition: transform 0.4s ease, box-shadow 0.4s ease;
    min-height: 250px; border-radius: 10px;
}
.message-box p { font-size: 1.15rem; line-height: 1.8; color: #FDF5E6; display: inline; font-weight: 500;}
.typewriter-cursor { display: inline-block; width: 3px; height: 1.1rem; background-color: var(--royal-gold); vertical-align: middle; margin-left: 2px; animation: blink 0.7s infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

.corner { position: absolute; width: 25px; height: 25px; border: 2px solid var(--royal-gold); }
.top-left { top: -2px; left: -2px; border-right: none; border-bottom: none; border-top-left-radius: 10px; }
.top-right { top: -2px; right: -2px; border-left: none; border-bottom: none; border-top-right-radius: 10px;}
.bottom-left { bottom: -2px; left: -2px; border-right: none; border-top: none; border-bottom-left-radius: 10px;}
.bottom-right { bottom: -2px; right: -2px; border-left: none; border-top: none; border-bottom-right-radius: 10px;}

/* Nút Tương Tác Yêu Em Nhiều */
.hug-btn {
    margin-top: 2rem; padding: 12px 35px; background: linear-gradient(135deg, #ff4d6d, #c9184a); color: white;
    font-family: var(--font-sans); font-size: 1.2rem; font-weight: bold;
    border: 2px solid #ffb3c1; border-radius: 30px; cursor: pointer;
    box-shadow: 0 4px 15px rgba(255, 77, 109, 0.5); transition: all 0.3s; z-index: 10;
    display: none; animation: pulseHug 2s infinite;
}
.hug-btn:hover { transform: scale(1.1); box-shadow: 0 8px 25px rgba(255, 77, 109, 0.8); }
@keyframes pulseHug { 0% { box-shadow: 0 0 0 0 rgba(255, 77, 109, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(255, 77, 109, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 77, 109, 0); } }

/* Heart Explosion (Nổ Trái Tim) */
.explosion-heart {
    position: fixed; font-size: 2rem; color: #ff4d6d; text-shadow: 0 0 15px rgba(255, 77, 109, 0.8);
    pointer-events: none; z-index: 9999; animation: explode 2.5s ease-out forwards;
}
@keyframes explode {
    0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--rot)); opacity: 0; }
}

.card-footer { margin-top: auto; padding-top: 3rem; position: relative; width: 100%; display: flex; justify-content: center; }
.glowing-moon { width: 100px; height: 100px; background: radial-gradient(circle at 30% 30%, #FFF, var(--royal-gold)); border-radius: 50%; box-shadow: 0 0 40px var(--royal-gold), inset -10px -10px 20px rgba(0,0,0,0.2); position: relative; z-index: 1; margin-bottom: 20px; }

/* =========================================
   6. CUSTOM POPUP
   ========================================= */
.custom-popup {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.75); display: flex; justify-content: center; align-items: center;
    z-index: 10000; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; backdrop-filter: blur(8px);
}
.custom-popup.active { opacity: 1; pointer-events: auto; }
.popup-content {
    background: linear-gradient(135deg, #4A0404, #7C0A02); padding: 2.5rem 1.5rem;
    border-radius: 20px; border: 2px solid var(--royal-gold); text-align: center;
    max-width: 85%; box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 30px rgba(255, 77, 109, 0.4);
    transform: scale(0.5); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.custom-popup.active .popup-content { transform: scale(1); }
.popup-content h3 { color: var(--royal-gold); margin-bottom: 15px; font-family: var(--font-heading); font-size: 2.2rem; }
.popup-content p { color: #FDF5E6; line-height: 1.6; margin-bottom: 25px; font-size: 1.15rem; font-family: var(--font-sans); }
.popup-content button {
    padding: 12px 35px; background: var(--royal-gold); color: #4A0404; font-weight: bold; font-family: var(--font-sans); font-size: 1.1rem;
    border: none; border-radius: 25px; cursor: pointer; transition: all 0.3s; box-shadow: 0 5px 15px rgba(255,215,0,0.4);
}
.popup-content button:hover { transform: scale(1.05); box-shadow: 0 8px 25px rgba(255,215,0,0.7); }

/* =========================================
   7. RESPONSIVE MOBILE
   ========================================= */
@media screen and (max-width: 768px) {
    .desktop-bg { display: none; }
    .phone-frame { width: 100vw; height: 100vh; border-radius: 0; border: none; box-shadow: none; }
    .phone-frame::before, .status-bar { display: none; }
    .app-content { padding-top: 0; }
    .card { padding: 2rem 1rem; justify-content: center; }
    .title { font-size: 3.2rem; }
    .message-box { padding: 2rem 1.2rem; min-height: 280px; }
}

</style>
</head>
<body>
    <!-- Nền động (Dynamic Background) -->
    <div class="desktop-bg" id="desktopBg">
        <div class="moon-aura">
            <div class="moon"></div>
        </div>
        <!-- JS sẽ chèn sao lấp lánh, đom đóm, pháo hoa, lồng đèn bay ở đây -->
    </div>

    <!-- Khung điện thoại -->
    <div class="phone-frame">
        
        <!-- Màn hình chờ (Intro) -->
        <div class="intro-screen" id="introScreen">
            <div class="intro-lantern">
                <div class="lantern-body"></div>
                <div class="tassel"></div>
            </div>
            <h2 class="intro-text">Một món quà nhỏ nhắn gửi đến em...</h2>
            <button class="open-btn" id="openBtn">Chạm để mở thiệp ✨</button>
        </div>

        <!-- Nhạc nền -->
        <audio id="bgMusic" loop preload="auto">
            <source src="music.m4a" type="audio/mp4">
            <source src="music.m4a" type="audio/x-m4a">
        </audio>

        <!-- Thanh trạng thái giả lập -->
        <div class="status-bar">
            <span class="time">19:30</span>
            <div class="icons">
                <span class="signal"><svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor"><rect y="6" width="3" height="4" rx="1"/><rect x="5" y="3" width="3" height="7" rx="1"/><rect x="10" width="3" height="10" rx="1"/></svg></span>
                <span class="wifi"><svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor"><path d="M7 10C8.10457 10 9 9.10457 9 8C9 6.89543 8.10457 6 7 6C5.89543 6 5 6.89543 5 8C5 10 7 10Z"/><path d="M2.05025 4.05025C4.78392 1.31658 9.21608 1.31658 11.9497 4.05025L13.364 2.63604C9.84924 -0.87868 4.15076 -0.87868 0.636039 2.63604L2.05025 4.05025Z"/></svg></span>
                <span class="battery"><svg width="20" height="10" viewBox="0 0 20 10" fill="currentColor"><rect width="17" height="10" rx="2"/><rect x="1" y="1" width="15" height="8" rx="1" fill="white"/><path d="M18 3H19C19.5523 3 20 3.44772 20 4V6C20 6.55228 19.5523 7 19 7H18V3Z"/></svg></span>
            </div>
        </div>

        <div class="app-content">
            <!-- Đom đóm trong thiệp -->
            <div id="cardFireflies"></div>

            <div class="card">
                <div class="lantern-container">
                    <div class="lantern left"><div class="lantern-body"></div><div class="tassel"></div></div>
                    <div class="lantern right"><div class="lantern-body"></div><div class="tassel"></div></div>
                </div>

                <div class="card-header">
                    <h1 class="title">Trung Thu<br>Viên Mãn</h1>
                    <p class="subtitle">Dành tặng người anh yêu</p>
                    <div class="divider"><span>✦</span></div>
                </div>
                
                <div class="message-box">
                    <span class="corner top-left"></span>
                    <span class="corner top-right"></span>
                    <span class="corner bottom-left"></span>
                    <span class="corner bottom-right"></span>
                    <p id="typewriter-text"></p><span class="typewriter-cursor"></span>
                </div>

                <!-- Nút Tương Tác Cấp Cao -->
                <button class="hug-btn" id="hugBtn">Yêu em nhiều 💖</button>

                <div class="card-footer">
                    <div class="glowing-moon"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Popup Lãng Mạn -->
    <div class="custom-popup" id="customPopup">
        <div class="popup-content">
            <h3>Lời hứa ngọt ngào 💖</h3>
            <p>Bầu trời đêm nay có ngàn vì sao, nhưng trong lòng anh chỉ có duy nhất một mình em! 🥰</p>
            <button id="closePopup">Nhận lời yêu</button>
        </div>
    </div>

    <script>
const introScreen = document.getElementById('introScreen');
const openBtn = document.getElementById('openBtn');
const bgMusic = document.getElementById('bgMusic');
const typeText = document.getElementById('typewriter-text');
const hugBtn = document.getElementById('hugBtn');
const cursor = document.querySelector('.typewriter-cursor');
const desktopBg = document.getElementById('desktopBg');
const cardFireflies = document.getElementById('cardFireflies');
const customPopup = document.getElementById('customPopup');
const closePopupBtn = document.getElementById('closePopup');

// 1. TẠO HIỆU ỨNG NỀN ĐỘNG (Chỉ hiển thị trên Desktop)
if (desktopBg) {
    // Tạo 100 ngôi sao lấp lánh ngẫu nhiên
    for (let i = 0; i < 100; i++) {
        let star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        const size = Math.random() * 3;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.animationDuration = (Math.random() * 3 + 2) + 's';
        star.style.animationDelay = (Math.random() * 2) + 's';
        desktopBg.appendChild(star);
    }

    // Tạo lồng đèn bay lên từ dưới
    setInterval(() => {
        let lantern = document.createElement('div');
        lantern.className = 'bg-lantern';
        lantern.style.left = Math.random() * 100 + '%';
        lantern.style.animationDuration = (Math.random() * 15 + 10) + 's';
        desktopBg.appendChild(lantern);
        setTimeout(() => lantern.remove(), 25000); // Dọn dẹp DOM
    }, 3500);
}

// 2. TẠO HẠT ĐOM ĐÓM BAY LƯỢN
function createFirefly(container) {
    if (!container) return;
    let firefly = document.createElement('div');
    firefly.className = 'firefly';
    firefly.style.left = Math.random() * 100 + '%';
    firefly.style.top = (Math.random() * 80 + 20) + '%';
    // Hướng bay ngẫu nhiên X và Y
    firefly.style.setProperty('--dir-x', (Math.random() - 0.5) * 2);
    firefly.style.setProperty('--dir-y', Math.random());
    firefly.style.animationDuration = (Math.random() * 6 + 4) + 's';
    container.appendChild(firefly);
    setTimeout(() => firefly.remove(), 10000);
}
// Chạy đom đóm bên trong thiệp
setInterval(() => createFirefly(cardFireflies), 600);
// Chạy đom đóm ngoài màn hình nền
if (desktopBg) setInterval(() => createFirefly(desktopBg), 400);

// 3. HIỆU ỨNG GÕ CHỮ (TYPEWRITER)
const message = "Dưới bầu trời rực rỡ muôn vàn vì sao và ánh trăng thanh bình, anh chỉ muốn gửi đến em những điều ngọt ngào nhất. Cảm ơn em đã là ánh sáng rực rỡ nhất trong cuộc đời anh. Chúc em một mùa Trung Thu thật ấm áp, viên mãn và tràn ngập tiếng cười. Trái tim anh luôn hướng về em. Yêu em vô vàn! 🌕🏮❤️";

let i = 0;
const typingSpeed = 65; 

function typeWriter() {
    if (i < message.length) {
        typeText.innerHTML += message.charAt(i);
        i++;
        setTimeout(typeWriter, typingSpeed);
    } else {
        cursor.style.display = 'none'; // Ẩn con trỏ
        hugBtn.style.display = 'block'; // Hiện nút tương tác cuối thiệp
    }
}

// 4. MỞ THIỆP (Zoom Intro)
openBtn.addEventListener('click', () => {
    // Hiệu ứng phóng to mờ dần
    introScreen.classList.add('hidden');
    
    setTimeout(() => {
        introScreen.style.display = 'none';
        setTimeout(typeWriter, 500); // Bắt đầu gõ chữ
    }, 1000); 
    
    // Play nhạc
    bgMusic.play().catch(error => console.log("Autoplay prevented:", error));
});

// 5. HIỆU ỨNG NỔ TRÁI TIM (Heart Explosion)
hugBtn.addEventListener('click', (e) => {
    // Lấy tọa độ nút bấm để nổ từ giữa nút
    const rect = hugBtn.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    for (let k = 0; k < 60; k++) {
        let heart = document.createElement('div');
        heart.className = 'explosion-heart';
        heart.innerHTML = '❤️';
        heart.style.left = centerX + 'px';
        heart.style.top = centerY + 'px';
        
        // Tính toán hướng bay 360 độ
        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 400 + 100; // Tốc độ văng
        const tx = Math.cos(angle) * velocity + 'px';
        const ty = Math.sin(angle) * velocity + 'px';
        const rot = Math.random() * 360 + 'deg';
        
        // Truyền biến CSS custom
        heart.style.setProperty('--tx', tx);
        heart.style.setProperty('--ty', ty);
        heart.style.setProperty('--rot', rot);
        
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 2500);
    }
    
    // Hiện Popup tỏ tình sau khi nổ tim
    setTimeout(() => {
        customPopup.classList.add('active');
    }, 1500);
});

// 6. ĐÓNG POPUP
closePopupBtn.addEventListener('click', () => {
    customPopup.classList.remove('active');
});

// 7. ĐỒNG HỒ THANH TRẠNG THÁI
function updateTime() {
    const now = new Date();
    const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    const timeElem = document.querySelector('.time');
    if (timeElem) timeElem.textContent = timeStr;
}
setInterval(updateTime, 60000);
updateTime();

</script>
</body>
</html>
