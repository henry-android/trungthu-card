<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiệp Trung Thu Yêu Thương</title>
    <!-- Google Fonts cho Typography hiện đại và lãng mạn -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- File CSS riêng biệt -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Nền bầu trời đêm trên Desktop -->
    <div class="desktop-bg">
        <div class="stars"></div>
        <div class="shooting-star"></div>
        <div class="moon"></div>
    </div>

    <!-- Khung điện thoại giả lập -->
    <div class="phone-frame">
        <!-- Màn hình chờ (Intro) -->
        <div class="intro-screen" id="introScreen">
            <div class="intro-lantern">
                <div class="lantern-body"></div>
                <div class="tassel"></div>
            </div>
            <button class="open-btn" id="openBtn">Mở quà Trung Thu</button>
        </div>

        <!-- Nhạc nền từ file music.m4a nội bộ -->
        <audio id="bgMusic" loop preload="auto">
            <source src="music.m4a" type="audio/mp4">
            <source src="music.m4a" type="audio/x-m4a">
        </audio>

        <!-- Container chứa các hiệu ứng hạt sáng & trái tim bay -->
        <div id="sparksContainer"></div>
        <div id="heartsContainer"></div>

        <!-- Thanh trạng thái giả lập (chỉ hiện trên Desktop) -->
        <div class="status-bar">
            <span class="time">19:30</span>
            <div class="icons">
                <span class="signal"><svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor"><rect y="6" width="3" height="4" rx="1"/><rect x="5" y="3" width="3" height="7" rx="1"/><rect x="10" width="3" height="10" rx="1"/></svg></span>
                <span class="wifi"><svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor"><path d="M7 10C8.10457 10 9 9.10457 9 8C9 6.89543 8.10457 6 7 6C5.89543 6 5 6.89543 5 8C5 10 7 10Z"/><path d="M2.05025 4.05025C4.78392 1.31658 9.21608 1.31658 11.9497 4.05025L13.364 2.63604C9.84924 -0.87868 4.15076 -0.87868 0.636039 2.63604L2.05025 4.05025Z"/></svg></span>
                <span class="battery"><svg width="20" height="10" viewBox="0 0 20 10" fill="currentColor"><rect width="17" height="10" rx="2"/><rect x="1" y="1" width="15" height="8" rx="1" fill="white"/><path d="M18 3H19C19.5523 3 20 3.44772 20 4V6C20 6.55228 19.5523 7 19 7H18V3Z"/></svg></span>
            </div>
        </div>

        <!-- Nội dung ứng dụng thiệp -->
        <div class="app-content">
            <div class="card">
                <!-- Lồng đèn treo hai bên -->
                <div class="lantern-container">
                    <div class="lantern left"><div class="lantern-body"></div><div class="tassel"></div></div>
                    <div class="lantern right"><div class="lantern-body"></div><div class="tassel"></div></div>
                </div>

                <div class="card-header">
                    <h1 class="title">Trung Thu<br>Viên Mãn</h1>
                    <p class="subtitle">Dành tặng người anh yêu</p>
                    <div class="divider"><span>✦</span></div>
                </div>
                
                <!-- Hộp thư với hiệu ứng gõ chữ -->
                <div class="message-box">
                    <span class="corner top-left"></span>
                    <span class="corner top-right"></span>
                    <span class="corner bottom-left"></span>
                    <span class="corner bottom-right"></span>
                    <p id="typewriter-text"></p><span class="typewriter-cursor"></span>
                </div>

                <!-- Nút tương tác -->
                <button class="hug-btn" id="hugBtn">Gửi ngàn cái ôm 💖</button>

                <div class="card-footer">
                    <div class="glowing-moon"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- File JavaScript riêng biệt -->
    <script src="script.js"></script>
</body>
</html>
