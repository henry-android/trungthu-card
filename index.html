<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thiệp Trung Thu Yêu Thương</title>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Nền động (Dynamic Background) -->
    <div class="desktop-bg" id="desktopBg">
      <div class="moon-aura">
        <div class="moon"></div>
      </div>
      <!-- JS sẽ chèn sao lấp lánh, đom đóm, pháo hoa, lồng đèn bay ở đây -->
    </div>

    <!-- Khung điện thoại -->
    <div class="phone-frame">
      <!-- Màn hình chờ (Intro) -->
      <div class="intro-screen" id="introScreen">
        <div class="intro-lantern">
          <div class="lantern-body"></div>
          <div class="tassel"></div>
        </div>
        <h2 class="intro-text">Một món quà nhỏ nhắn gửi đến em...</h2>
        <button class="open-btn" id="openBtn">Chạm để mở thiệp ✨</button>
      </div>

      <!-- Nhạc nền -->
      <audio id="bgMusic" loop preload="auto">
        <source src="music.m4a" type="audio/mp4" />
        <source src="music.m4a" type="audio/x-m4a" />
      </audio>

      <!-- Thanh trạng thái giả lập -->
      <div class="status-bar">
        <span class="time">19:30</span>
        <div class="icons">
          <span class="signal"
            ><svg
              width="14"
              height="10"
              viewBox="0 0 14 10"
              fill="currentColor"
            >
              <rect y="6" width="3" height="4" rx="1" />
              <rect x="5" y="3" width="3" height="7" rx="1" />
              <rect x="10" width="3" height="10" rx="1" /></svg
          ></span>
          <span class="wifi"
            ><svg
              width="14"
              height="10"
              viewBox="0 0 14 10"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle cx="7" cy="8" r="1.3" fill="currentColor" />
              <path
                d="M2.2 4.5C4.6 2.3 9.4 2.3 11.8 4.5"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
              />
              <path
                d="M0.8 2.8C4.2 0.2 9.8 0.2 13.2 2.8"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
              /></svg
          ></span>
          <span class="battery"
            ><svg
              width="20"
              height="10"
              viewBox="0 0 20 10"
              fill="currentColor"
            >
              <rect width="17" height="10" rx="2" />
              <rect x="1" y="1" width="15" height="8" rx="1" fill="white" />
              <path
                d="M18 3H19C19.5523 3 20 3.44772 20 4V6C20 6.55228 19.5523 7 19 7H18V3Z"
              /></svg
          ></span>
        </div>
      </div>

      <div class="app-content">
        <!-- Đom đóm trong thiệp -->
        <div id="cardFireflies"></div>

        <div class="card">
          <div class="lantern-container">
            <div class="lantern left">
              <div class="lantern-body"></div>
              <div class="tassel"></div>
            </div>
            <div class="lantern right">
              <div class="lantern-body"></div>
              <div class="tassel"></div>
            </div>
          </div>

          <div class="card-header">
            <h1 class="title">Trung Thu<br />Viên Mãn</h1>
            <p class="subtitle">Dành tặng Hồng Nhung cục dàng của anh</p>
            <div class="divider"><span>✦</span></div>
          </div>

          <div class="message-box">
            <span class="corner top-left"></span>
            <span class="corner top-right"></span>
            <span class="corner bottom-left"></span>
            <span class="corner bottom-right"></span>
            <p id="typewriter-text"></p>
            <span class="typewriter-cursor"></span>
          </div>

          <!-- Nút Tương Tác Cấp Cao -->
          <button class="hug-btn" id="hugBtn">Yêu em nhiều 💖</button>

          <div class="card-footer">
            <div class="glowing-moon"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Custom Popup Lãng Mạn -->
    <div class="custom-popup" id="customPopup">
      <div class="popup-content">
        <h3>Lời hứa ngọt ngào 💖</h3>
        <p>
          Bầu trời đêm nay có ngàn vì sao, nhưng trong lòng anh chỉ có duy nhất
          một mình em! 🥰
        </p>
        <button id="closePopup">Nhận lời yêu</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
